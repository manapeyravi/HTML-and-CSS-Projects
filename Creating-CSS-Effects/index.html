<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Custom Fonts & Hover Effects</title>

  <!-- Google Fonts Import (Roboto & Montserrat) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Interactive Image Gallery</h1>
  <p>Hover over the images below to see the CSS transformations in action.</p>

  <div class="gallery">
    <!-- Image 1: Scale & Rotation -->
    <div class="image-card">
      <img src="https://picsum.photos/300/200?random=1" alt="Sample 1" class="effect-scale">
    </div>

    <!-- Image 2: Grayscale to Color + Lift -->
    <div class="image-card">
      <img src="https://picsum.photos/300/200?random=2" alt="Sample 2" class="effect-color">
    </div>
  </div>

</body>
</html>
